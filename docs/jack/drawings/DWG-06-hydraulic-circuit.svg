<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" width="1180" height="700" font-family="Arial, Helvetica, sans-serif">
  <style>
    .c{fill:none;stroke:#111;stroke-width:2}
    .l{fill:none;stroke:#111;stroke-width:2.2}
    .pil{fill:none;stroke:#111;stroke-width:1.2;stroke-dasharray:6 4}
    .box{fill:#fff;stroke:#111;stroke-width:2}
    .lbl{fill:#111;font-size:13px}
    .sm{fill:#111;font-size:11px}
    .ttl{fill:#111;font-size:19px;font-weight:bold}
    .hl{fill:#fdf3d0;stroke:#111;stroke-width:2}
  </style>
  <rect width="1180" height="700" fill="#fff"/>
  <text x="50" y="36" class="ttl">HYDRAULIC CIRCUIT — 700 bar, double acting, two cylinders in parallel</text>

  <!-- Tank -->
  <path d="M90 470 L90 560 L210 560 L210 470" class="c"/>
  <text x="108" y="582" class="lbl">TANK ≥ 3 L</text>

  <!-- Pump -->
  <circle cx="150" cy="400" r="26" class="box"/>
  <path d="M150 374 L140 392 L160 392 Z" fill="#111"/>
  <text x="80" y="356" class="lbl">PUMP</text>
  <text x="46" y="338" class="sm">2-speed manual or 0.75 kW electric, 700 bar</text>
  <line x1="150" y1="470" x2="150" y2="426" class="l"/>
  <line x1="150" y1="374" x2="150" y2="300" class="l"/>

  <!-- Relief valve -->
  <rect x="236" y="330" width="46" height="60" class="box"/>
  <path d="M236 390 L282 330" class="c"/>
  <path d="M259 330 L259 310" class="c"/>
  <path d="M252 322 L266 318" class="c"/>
  <line x1="150" y1="330" x2="236" y2="330" class="l"/>
  <line x1="259" y1="390" x2="259" y2="520" class="l"/>
  <line x1="259" y1="520" x2="150" y2="520" class="l"/>
  <text x="292" y="352" class="lbl">RELIEF VALVE</text>
  <text x="292" y="370" class="sm">set 580 bar for 0.6" work / 410 bar for 0.5" work</text>
  <text x="292" y="386" class="sm">absolute ceiling 660 bar — lead-sealed after calibration</text>

  <!-- Gauge -->
  <circle cx="150" cy="262" r="26" class="box"/>
  <path d="M150 262 L166 248" class="c"/>
  <text x="46" y="228" class="lbl">GAUGE Ø100</text>
  <text x="16" y="212" class="sm">0–1000 bar, class 1.0, glycerine filled, calibrated as a pair with the jack</text>

  <!-- 4/3 valve -->
  <g>
    <rect x="330" y="240" width="180" height="70" class="box"/>
    <line x1="390" y1="240" x2="390" y2="310" class="c"/>
    <line x1="450" y1="240" x2="450" y2="310" class="c"/>
    <path d="M345 255 L375 295 M345 295 L375 255" class="c"/>
    <path d="M400 250 L440 250 M400 300 L440 300" class="c"/>
    <path d="M400 250 L400 300" class="pil"/>
    <path d="M465 255 L495 255 M465 295 L495 295" class="c"/>
    <path d="M465 255 L495 295" class="c"/>
  </g>
  <text x="330" y="232" class="lbl">4/3 DIRECTIONAL VALVE (centre position = closed / hold)</text>
  <line x1="150" y1="300" x2="330" y2="300" class="l"/>
  <line x1="330" y1="262" x2="176" y2="262" class="l"/>

  <!-- POCV -->
  <rect x="560" y="200" width="70" height="60" class="box"/>
  <circle cx="595" cy="230" r="10" fill="#111"/>
  <path d="M580 245 L610 245" class="c"/>
  <path d="M560 230 L520 230" class="pil"/>
  <text x="560" y="192" class="lbl">PILOT-OPERATED CHECK (load hold)</text>
  <text x="560" y="178" class="sm">holds the tendon while anchor wedges are seated; leak-free</text>

  <!-- velocity fuse -->
  <rect x="680" y="200" width="60" height="60" class="box"/>
  <path d="M690 230 L730 230" class="c"/>
  <circle cx="710" cy="230" r="7" class="c"/>
  <text x="664" y="192" class="lbl">HOSE-BURST / VELOCITY FUSE</text>

  <line x1="510" y1="262" x2="545" y2="262" class="l"/>
  <line x1="545" y1="262" x2="545" y2="230" class="l"/>
  <line x1="545" y1="230" x2="560" y2="230" class="l"/>
  <line x1="630" y1="230" x2="680" y2="230" class="l"/>
  <line x1="740" y1="230" x2="800" y2="230" class="l"/>
  <line x1="510" y1="290" x2="800" y2="290" class="l"/>
  <line x1="510" y1="290" x2="510" y2="288" class="l"/>

  <!-- quick couplers -->
  <g>
    <rect x="800" y="220" width="16" height="20" class="box"/><rect x="816" y="220" width="16" height="20" class="box"/>
    <rect x="800" y="280" width="16" height="20" class="box"/><rect x="816" y="280" width="16" height="20" class="box"/>
  </g>
  <text x="790" y="212" class="sm">700 bar quick couplers (different sizes A/B — cannot be cross-connected)</text>

  <!-- Jack -->
  <rect x="880" y="120" width="230" height="330" fill="none" stroke="#111" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="890" y="112" class="lbl" font-weight="bold">JACK</text>
  <!-- cyl 1 -->
  <rect x="910" y="160" width="170" height="60" class="hl"/>
  <line x1="1000" y1="160" x2="1000" y2="220" class="c"/>
  <line x1="1000" y1="190" x2="1110" y2="190" class="c" stroke-width="5"/>
  <text x="922" y="152" class="sm">CYL 1  Ø50 / Ø32 / 200</text>
  <!-- cyl 2 -->
  <rect x="910" y="350" width="170" height="60" class="hl"/>
  <line x1="1000" y1="350" x2="1000" y2="410" class="c"/>
  <line x1="1000" y1="380" x2="1110" y2="380" class="c" stroke-width="5"/>
  <text x="922" y="342" class="sm">CYL 2  Ø50 / Ø32 / 200</text>

  <!-- manifold lines -->
  <line x1="832" y1="230" x2="860" y2="230" class="l"/>
  <line x1="860" y1="230" x2="860" y2="205" class="l"/>
  <line x1="860" y1="205" x2="915" y2="205" class="l"/>
  <line x1="860" y1="230" x2="860" y2="395" class="l"/>
  <line x1="860" y1="395" x2="915" y2="395" class="l"/>
  <line x1="832" y1="290" x2="848" y2="290" class="l"/>
  <line x1="848" y1="290" x2="848" y2="175" class="l"/>
  <line x1="848" y1="175" x2="1075" y2="175" class="l"/>
  <line x1="848" y1="290" x2="848" y2="365" class="l"/>
  <line x1="848" y1="365" x2="1075" y2="365" class="l"/>
  <text x="892" y="250" class="sm">A (extend)</text>
  <text x="892" y="310" class="sm">B (retract)</text>

  <g class="lbl">
    <text x="50" y="620" font-weight="bold">CIRCUIT NOTES</text>
    <text x="50" y="640">1. Both extend chambers are fed from ONE gallery of equal branch length — this, plus the rigid yoke/crossbeam, is what synchronises the cylinders. Do NOT fit a flow divider.</text>
    <text x="50" y="658">2. Displacement per full stroke: extend 785 cm³, retract 464 cm³. Size the tank ≥ 3 L. A single-speed hand pump needs ≈ 260 handle strokes per pull — use a 2-speed or electric pump.</text>
    <text x="50" y="676">3. Gauge and jack are calibrated together as one unit and must stay together; mark them with the same serial number.</text>
  </g>
</svg>
