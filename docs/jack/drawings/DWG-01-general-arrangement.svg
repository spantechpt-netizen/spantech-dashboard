<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" width="1180" height="760" font-family="Arial, Helvetica, sans-serif">
  <style>
    .out{fill:#e8eaed;stroke:#111;stroke-width:2}
    .alu{fill:#dfe3e8;stroke:#111;stroke-width:2}
    .stl{fill:#c9ced6;stroke:#111;stroke-width:2}
    .hid{fill:none;stroke:#111;stroke-width:1;stroke-dasharray:7 4}
    .cl{fill:none;stroke:#c0392b;stroke-width:1;stroke-dasharray:14 4 3 4}
    .dim{stroke:#1a5fb4;stroke-width:1;fill:none}
    .dimt{fill:#1a5fb4;font-size:13px}
    .lbl{fill:#111;font-size:13px}
    .ttl{fill:#111;font-size:19px;font-weight:bold}
    .sub{fill:#444;font-size:13px}
    .lead{stroke:#111;stroke-width:1;fill:none}
    .strand{stroke:#6b4423;stroke-width:4;fill:none}
  </style>
  <rect width="1180" height="760" fill="#ffffff"/>

  <!-- ============ VIEW A : PLAN (looking down) ============ -->
  <text x="60" y="40" class="ttl">VIEW A — PLAN  (scale 1:4)</text>
  <text x="60" y="58" class="sub">Body assembly moves REARWARD (+X) while nose yoke reacts on the anchorage</text>

  <!-- transform: model x -> 70 + x*0.62 ; model z -> 215 + z*0.62 -->
  <g transform="translate(70,215) scale(0.62)">
    <!-- strand -->
    <line x1="-90" y1="0" x2="600" y2="0" class="strand"/>
    <!-- nose yoke 0..60 , z -135..135 -->
    <rect x="0" y="-135" width="75" height="270" class="alu"/>
    <rect x="0" y="-11" width="75" height="22" class="hid"/>
    <!-- rods -->
    <rect x="75" y="64" width="10" height="32" class="stl"/>
    <rect x="75" y="-96" width="10" height="32" class="stl"/>
    <!-- cylinder tubes 80..380 OD70 at z=+-80 -->
    <rect x="85" y="45" width="310" height="70" class="stl"/>
    <rect x="85" y="-115" width="310" height="70" class="stl"/>
    <line x1="85" y1="80" x2="395" y2="80" class="cl"/>
    <line x1="85" y1="-80" x2="395" y2="-80" class="cl"/>
    <!-- glands -->
    <rect x="85" y="45" width="45" height="70" class="alu"/>
    <rect x="85" y="-115" width="45" height="70" class="alu"/>
    <!-- crossbeam / manifold 350..420 -->
    <rect x="365" y="-135" width="80" height="270" class="alu"/>
    <!-- feed tubes -->
    <path d="M375 45 L375 20 L145 20 L145 45" class="lead" stroke-width="2"/>
    <path d="M375 -45 L375 -20 L145 -20 L145 -45" class="lead" stroke-width="2"/>
    <!-- gripper -->
    <rect x="445" y="-32.5" width="75" height="65" class="stl"/>
    <rect x="520" y="-20" width="14" height="40" class="stl"/>
    <!-- extended position ghost -->
    <rect x="260" y="-150" width="1" height="1" fill="none"/>
    <line x1="0" y1="0" x2="600" y2="0" class="cl"/>
  </g>

  <!-- dims for plan -->
  <g>
    <line x1="70" y1="330" x2="70" y2="360" class="dim"/>
    <line x1="402" y1="330" x2="402" y2="360" class="dim"/>
    <line x1="70" y1="352" x2="402" y2="352" class="dim" marker-start="url(#a)" marker-end="url(#a)"/>
    <text x="180" y="347" class="dimt">535 RETRACTED</text>

    <line x1="70" y1="375" x2="70" y2="400" class="dim"/>
    <line x1="526" y1="330" x2="526" y2="400" class="dim"/>
    <line x1="70" y1="392" x2="526" y2="392" class="dim" marker-start="url(#a)" marker-end="url(#a)"/>
    <text x="185" y="387" class="dimt">735 FULLY EXTENDED (stroke 200)</text>

    <line x1="20" y1="131" x2="60" y2="131" class="dim"/>
    <line x1="20" y1="299" x2="60" y2="299" class="dim"/>
    <line x1="38" y1="131" x2="38" y2="299" class="dim" marker-start="url(#a)" marker-end="url(#a)"/>
    <text x="18" y="222" class="dimt" transform="rotate(-90,18,222)">270 WIDTH</text>

    <line x1="560" y1="165" x2="620" y2="165" class="dim"/>
    <line x1="560" y1="265" x2="620" y2="265" class="dim"/>
    <line x1="600" y1="165" x2="600" y2="265" class="dim" marker-start="url(#a)" marker-end="url(#a)"/>
    <text x="606" y="219" class="dimt">160 C/C</text>
  </g>

  <!-- balloons on geometry -->
  <g>
    <g fill="#fff" stroke="#111" stroke-width="1.4">
      <circle cx="93" cy="215" r="9"/><circle cx="120" cy="265" r="9"/><circle cx="219" cy="265" r="9"/>
      <circle cx="169" cy="227" r="9"/><circle cx="321" cy="153" r="9"/><circle cx="369" cy="215" r="9"/>
      <circle cx="405" cy="215" r="9"/>
    </g>
    <g fill="#111" font-size="12" font-weight="bold" text-anchor="middle">
      <text x="93" y="219">1</text><text x="120" y="269">2</text><text x="219" y="269">3</text>
      <text x="169" y="231">4</text><text x="321" y="157">5</text><text x="369" y="219">6</text>
      <text x="405" y="219">7</text>
    </g>
  </g>
  <!-- legend -->
  <g class="lbl">
    <text x="60" y="440" font-weight="bold">PARTS LIST</text>
    <text x="60" y="462">1  NOSE YOKE (7075-T651) — bears on the anchorage face</text>
    <text x="60" y="482">2  PISTON ROD Ø32 — 42CrMo4 QT + hard chrome 25 µm</text>
    <text x="60" y="502">3  CYLINDER TUBE Ø50 H8 / Ø70 — honed steel E355</text>
    <text x="60" y="522">4  HP FEED TUBE Ø8x2.5 — rod-side (retract) line</text>
    <text x="60" y="542">5  REAR CROSSBEAM / MANIFOLD (7075-T651)</text>
    <text x="60" y="562">6  WEDGE GRIPPER Ø65 x 75 — 42CrMo4 QT, nitrided bore</text>
    <text x="60" y="582">7  STRAND Ø15.24 (0.6") or Ø12.7 (0.5") — 1860 MPa</text>
  </g>

  <!-- ============ VIEW B : FRONT (from anchorage) ============ -->
  <text x="720" y="40" class="ttl">VIEW B — FRONT (from anchorage)</text>
  <g transform="translate(895,215) scale(0.62)">
    <rect x="-135" y="-85" width="270" height="170" rx="10" class="alu"/>
    <!-- slot -->
    <path d="M-11 85 L-11 0 A11 11 0 0 1 11 0 L11 85" fill="#ffffff" stroke="#111" stroke-width="2"/>
    <!-- cylinders -->
    <circle cx="-80" cy="0" r="35" class="stl"/><circle cx="80" cy="0" r="35" class="stl"/>
    <circle cx="-80" cy="0" r="16" class="stl"/><circle cx="80" cy="0" r="16" class="stl"/>
    <line x1="-135" y1="0" x2="135" y2="0" class="cl"/>
    <line x1="0" y1="-85" x2="0" y2="95" class="cl"/>
    <line x1="-80" y1="-50" x2="-80" y2="50" class="cl"/>
    <line x1="80" y1="-50" x2="80" y2="50" class="cl"/>
    <!-- strand -->
    <circle cx="0" cy="0" r="7.6" fill="#6b4423"/>
    <!-- handle -->
    <path d="M-60 -85 L-60 -120 L60 -120 L60 -85" fill="none" stroke="#111" stroke-width="4"/>
  </g>
  <g class="dimt">
    <line x1="783" y1="330" x2="783" y2="355" class="dim"/>
    <line x1="1007" y1="330" x2="1007" y2="355" class="dim"/>
    <line x1="783" y1="348" x2="1007" y2="348" class="dim" marker-start="url(#a)" marker-end="url(#a)"/>
    <text x="855" y="343">270</text>
    <line x1="1030" y1="162" x2="1060" y2="162" class="dim"/>
    <line x1="1030" y1="268" x2="1060" y2="268" class="dim"/>
    <line x1="1050" y1="162" x2="1050" y2="268" class="dim" marker-start="url(#a)" marker-end="url(#a)"/>
    <text x="1056" y="218">170</text>
    <text x="900" y="300">22 side-entry slot</text>
    <text x="700" y="120">carry handle</text>
  </g>

  <!-- notes -->
  <g class="lbl">
    <text x="720" y="400" font-weight="bold">PRINCIPLE OF OPERATION</text>
    <text x="720" y="422">The two rods push forward against the anchorage bearing plate through</text>
    <text x="720" y="440">the nose yoke. The jack body (with the wedge gripper clamping the strand)</text>
    <text x="720" y="458">is therefore driven rearward, tensioning the strand. Both cylinders are fed</text>
    <text x="720" y="476">from one manifold and rigidly tied by yoke + crossbeam, so they are</text>
    <text x="720" y="494">kinematically synchronised. Retract is powered (double acting).</text>
  </g>

  <!-- title block -->
  <g>
    <rect x="60" y="600" width="1060" height="120" fill="none" stroke="#111" stroke-width="2"/>
    <line x1="60" y1="640" x2="1120" y2="640" stroke="#111" stroke-width="1"/>
    <line x1="760" y1="600" x2="760" y2="720" stroke="#111" stroke-width="1"/>
    <line x1="940" y1="600" x2="940" y2="720" stroke="#111" stroke-width="1"/>
    <text x="72" y="628" class="ttl">MONO-STRAND POST-TENSIONING STRESSING JACK — 250 kN (25 tf)</text>
    <text x="72" y="662" class="lbl">TWIN CYLINDER, DOUBLE ACTING, 700 bar MAX — GENERAL ARRANGEMENT</text>
    <text x="72" y="684" class="lbl">All dimensions in millimetres. Third-angle projection. Do not scale drawing.</text>
    <text x="72" y="706" class="lbl">Tolerances unless stated: linear ISO 2768-m, bores H8, rods f7</text>
    <text x="772" y="628" class="lbl">DWG No.</text><text x="772" y="662" class="ttl">PT-JACK-01</text>
    <text x="772" y="690" class="lbl">Sheet 1 of 7</text>
    <text x="952" y="628" class="lbl">Rev.</text><text x="952" y="662" class="ttl">A</text>
    <text x="952" y="690" class="lbl">Scale 1:4 @ A3</text>
  </g>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0 5 L10 2 L10 8 Z" fill="#1a5fb4"/>
    </marker>
  </defs>
</svg>
